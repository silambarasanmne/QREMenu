{% extends "counter/base.html" %}

{% block login %}
<div class="flex items-center justify-center min-h-[70vh] py-12 px-4 sm:px-6">
  <div class="w-full max-w-md space-y-8">
    
    <div class="glass-modal rounded-3xl p-8 border border-slate-800 space-y-6 shadow-2xl relative overflow-hidden">
      <div class="absolute -top-12 -right-12 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>

      <!-- Form Header -->
      <div class="text-center space-y-2">
        <div class="w-14 h-14 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-400 flex items-center justify-center text-2xl mx-auto mb-3 shadow-inner">
          <i class="fa-solid fa-user-lock"></i>
        </div>
        <h2 class="font-serif text-2xl font-bold text-white">Cashier Staff Login</h2>
        <p class="text-xs text-slate-400">Access billing counter dashboard and settlement controls.</p>
      </div>

      <!-- Messages Alert -->
      {% if messages %}
      <div class="p-3.5 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-xs text-rose-300 space-y-1">
        {% for message in messages %}
          <p class="flex items-center space-x-1.5 font-bold"><i class="fa-solid fa-triangle-exclamation"></i> <span>{{ message }}</span></p>
        {% endfor %}
      </div>
      {% endif %}

      <!-- Login Form -->
      <form method="post" action="" class="space-y-4">
        {% csrf_token %}
        {% if request.GET.next or next %}
          <input type="hidden" name="next" value="{{ request.GET.next|default:next }}">
        {% endif %}

        <div class="space-y-1">
          <label for="username" class="text-xs font-bold text-slate-300">Username</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-user text-xs"></i>
            </div>
            <input type="text" name="username" id="username" placeholder="Enter staff username" required
              class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition-all">
          </div>
        </div>

        <div class="space-y-1">
          <label for="password" class="text-xs font-bold text-slate-300">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i class="fa-solid fa-key text-xs"></i>
            </div>
            <input type="password" name="password" id="password" placeholder="Enter password" required
              class="w-full pl-10 pr-4 py-3 bg-slate-900 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 transition-all">
          </div>
        </div>

        <button type="submit"
          class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-extrabold text-sm rounded-xl shadow-lg shadow-amber-500/25 flex items-center justify-center space-x-2 transition-all active:scale-[0.98]">
          <span>Sign In to POS Counter</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>

      </form>

    </div>

  </div>
</div>
{% endblock %}
